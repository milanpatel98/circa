[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circa"
version = "0.1.0"
description = "Answers questions about a patient record, citing the FHIR resource behind every sentence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milan Patel" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
circa = "circa.cli:main"

[tool.setuptools.packages.find]
include = ["circa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
